<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora CAGR - Smart Portfolios Cap. 1</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; max-width: 600px; }
        input, button, textarea { padding: 0.5rem; margin: 0.5rem; width: 100%; box-sizing: border-box; }
        #result { margin-top: 1rem; padding: 1rem; background: #f0f8ff; border-radius: 4px; }
        .example { color: #666; font-size: 0.9em; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <h2>📊 Calculadora de CAGR (Capítulo 1 - Smart Portfolios)</h2>
    <p>Ingresa retornos mensuales (uno por línea, formato decimal: 0.015 = 1.5%):</p>
    <textarea id="returns" rows="6" placeholder="Ejemplo:
0.02
-0.015
0.03
0.01
-0.025
0.04
-0.005
0.02
0.01
-0.01">0.02
-0.015
0.03
0.01
-0.025
0.04
-0.005
0.02
0.01
-0.01</textarea>
    <p class="example">(Puedes reemplazar este ejemplo con tus propios datos)</p>
    <button id="calcBtn" style="background: #0066cc; color: white; border: none; cursor: pointer;">Calcular CAGR</button>
    <div id="result"></div>

    <script>
        document.getElementById('calcBtn').addEventListener('click', function() {
            const textarea = document.getElementById('returns');
            const text = textarea.value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!text) {
                resultDiv.textContent = '❌ Error: Por favor ingresa algunos retornos';
                resultDiv.style.color = 'red';
                return;
            }
            
            // Parsear retornos (soporta decimales y porcentajes opcionalmente)
            const returns = text.split(/\s+/)
                .map(s => {
                    // Si termina en %, convertir de porcentaje a decimal
                    if (s.endsWith('%')) return parseFloat(s) / 100;
                    return parseFloat(s);
                })
                .filter(s => !isNaN(s));
            
            if (returns.length === 0) {
                resultDiv.textContent = '❌ Error: No se pudieron leer los retornos válidos';
                resultDiv.style.color = 'red';
                return;
            }
            
            // Calcular retorno total compuesto
            let totalReturn = 1;
            for (let i = 0; i < returns.length; i++) {
                totalReturn *= (1 + returns[i]);
            }
            totalReturn = totalReturn - 1; // Convertir a retorno neto
            
            // Calcular CAGR (asumiendo que los retornos son mensuales)
            const months = returns.length;
            const years = months / 12;
            const cagr = years > 0 ? Math.pow(1 + totalReturn, 1/years) - 1 : 0;
            
            // Mostrar resultado
            resultDiv.innerHTML = `
                ✅ <strong>CAGR: ${(cagr * 100).toFixed(2)}% anual</strong><br>
                <small>Basado en ${months} retornos mensuales (${years.toFixed(1)} años)</small><br>
                <small>Retorno total del período: ${(totalReturn * 100).toFixed(2)}%</small>
            `;
            resultDiv.style.color = '#006600';
        });
        
        // También permitir calcular con Enter en el textarea
        document.getElementById('returns').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('calcBtn').click();
            }
        });
    </script>
</body>
</html>
